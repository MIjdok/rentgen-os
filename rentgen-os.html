<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РентгенОС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --void:#08080a;
  --rail:#0b0b0d;
  --win:#121215;
  --win-2:#17171b;
  --raise:#1f1f24;
  --raise-2:#2a2a30;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --ink:#f2f1ed;
  --ink-2:#a3a2a9;
  --ink-3:#63626b;
  --signal:#ff4f1f;
  --signal-ink:#190600;
  --signal-soft:rgba(255,79,31,.16);
  --scan:#86f2ff;
  --scan-bg:#020a10;
  --paper:#e9e8e4;
  --paper-2:#dcdbd6;
  --paper-ink:#141416;
  --paper-ink-2:#6f6e69;
  --ok:#63e39a;
  --c-tag:#ff8a5c;
  --c-attr:#e8c27d;
  --c-str:#c6e48b;
  --c-kw:#c59bff;
  --c-com:#5b5a63;
  --c-num:#ffb36b;
  --c-fn:#9ec5ff;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --rail-w:64px;
  --side-w:300px;
  --gap:12px;
  color-scheme: dark;
}
@property --lr { syntax:"<length>";inherits:false;initial-value:0px }
@property --lx { syntax:"<length>";inherits:false;initial-value:0px }
@property --ly { syntax:"<length>";inherits:false;initial-value:0px }
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font: 14px/1.4 var(--f-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: #3a3a42 transparent;
}
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-thumb {
  background: #3a3a42;
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: #55555e;
  background-clip: content-box;
  border: 2px solid transparent;
}
::-webkit-scrollbar-track,
::-webkit-scrollbar-corner {
  background: transparent;
}
::-webkit-scrollbar-button {
  display: none;
}
[hidden] {
  display: none !important;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}
.mono {
  font-family: var(--f-mono);
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.dm .o {
  opacity: .13;
}
.pxa {
  display: block;
  border-radius: inherit;
}
.pxa .bgc {
  fill: #1c1c21;
}
.pxa .on {
  fill: var(--pc);
}
.av {
  display: inline-block;
  border-radius: 9px;
  overflow: hidden;
  flex: none;
  position: relative;
  line-height: 0;
}
.av.r {
  border-radius: 50%;
}
.av-on {
  position: relative;
  display: inline-block;
  line-height: 0;
  flex: none;
}
.av-on::after {
  content: "";
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--ok);
  border: 2px solid var(--win);
}
.stack {
  display: flex;
}
.stack .av {
  border: 2px solid var(--sbg,#000);
  margin-left: -8px;
  border-radius: 50%;
}
.stack .av:first-child {
  margin-left: 0;
}
.kbd {
  font: 500 10px/1 var(--f-mono);
  padding: 3px 5px;
  border-radius: 5px;
  background: var(--raise-2);
  color: var(--ink-2);
}
#os {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--void);
}
.wall {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.dotgrid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .12) 1px, transparent 1.3px);
  background-size: 24px 24px;
  -webkit-mask-image:
    linear-gradient(
      90deg,
      rgba(0, 0, 0, .9),
      rgba(0, 0, 0, .35));
  mask-image:
    linear-gradient(
      90deg,
      rgba(0, 0, 0, .9),
      rgba(0, 0, 0, .35));
  pointer-events: none;
}
.screen {
  position: absolute;
  inset: 0;
}
.rail {
  position: absolute;
  left: calc(var(--gap) + env(safe-area-inset-left, 0px));
  top: var(--gap);
  bottom: var(--gap);
  width: var(--rail-w);
  z-index: 50;
  background: var(--rail);
  border: 1px solid var(--line);
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 6px;
}
.r-logo {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--void);
  display: grid;
  place-items: center;
  position: relative;
  transition: transform .3s var(--ease);
}
.r-logo:hover {
  transform: rotate(-90deg);
}
.r-me {
  margin-top: 10px;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  box-shadow: 0 0 0 2px var(--rail), 0 0 0 3px var(--line-2);
}
.r-apps {
  margin: auto 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
}
.rb {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition:
    background .2s,
    color .2s,
    transform .2s var(--ease);
}
.rb:hover {
  background: var(--raise);
  color: var(--ink);
}
.rb:active {
  transform: scale(.92);
}
.rb.on {
  background: var(--raise-2);
  color: var(--ink);
}
.rb.run::before {
  content: "";
  position: absolute;
  left: -9px;
  top: 50%;
  width: 4px;
  height: 4px;
  margin-top: -2px;
  border-radius: 1px;
  background: var(--signal);
  box-shadow: 0 0 8px var(--signal);
}
.rb.on.run::before {
  height: 14px;
  margin-top: -7px;
  border-radius: 2px;
}
.rb .tip {
  position: absolute;
  left: 54px;
  top: 50%;
  display: flex;
  gap: 8px;
  align-items: center;
  white-space: nowrap;
  padding: 6px 8px 6px 10px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--void);
  font-size: 12.5px;
  font-weight: 600;
  opacity: 0;
  transform: translate(-6px, -50%);
  pointer-events: none;
  transition: opacity .15s, transform .2s var(--ease);
}
.rb .tip .kbd {
  background: rgba(0, 0, 0, .1);
  color: #555;
}
.rb:hover .tip,
.rb:focus-visible .tip {
  opacity: 1;
  transform: translate(0, -50%);
}
.rb .cnt {
  position: absolute;
  top: 5px;
  right: 5px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--signal);
  color: var(--signal-ink);
  font: 700 9.5px/16px var(--f-mono);
  text-align: center;
  box-shadow: 0 0 0 2px var(--rail);
}
.r-sep {
  width: 22px;
  height: 1px;
  background: var(--line-2);
  margin: 4px 0;
}
.r-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.top {
  position: absolute;
  top: var(--gap);
  left: calc(var(--gap)*2 + var(--rail-w));
  right: calc(var(--gap)*2 + var(--side-w) + env(safe-area-inset-right, 0px));
  height: 44px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 14px 0 6px;
  border-radius: 14px;
  background: rgba(14, 14, 17, .72);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  position: relative;
}
.chip b {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.2;
}
.chip small {
  display: block;
  font: 500 10.5px/1.3 var(--f-mono);
  color: var(--ink-3);
  letter-spacing: .04em;
}
.cmd {
  flex: 1;
  max-width: 460px;
  margin: 0 auto;
  height: 40px;
  border-radius: 12px;
  background: rgba(8, 8, 10, .62);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 0 12px;
  color: var(--ink-3);
  font: 500 11.5px var(--f-mono);
  letter-spacing: .07em;
  text-transform: uppercase;
  text-align: left;
  position: relative;
  transition: border-color .2s, color .2s;
}
.cmd:hover {
  border-color: var(--line-2);
  color: var(--ink-2);
}
.cmd .ct {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.cmd .caret {
  display: inline-block;
  width: 7px;
  height: 13px;
  background: var(--signal);
  vertical-align: -2px;
  margin-left: 2px;
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink {
  50% {
    opacity: 0;
  }
}
.team {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 6px 0 7px;
  border-radius: 14px;
  background: #000;
  border: 1px solid var(--line);
  --sbg:#000;
  position: relative;
}
.team .tt b {
  display: block;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
}
.team .tt small {
  display: block;
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
}
.team .tt small i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  margin-right: 5px;
  vertical-align: 1px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  50% {
    opacity: .35;
  }
}
.rnd {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--raise-2);
  color: var(--ink);
  transition: background .2s, transform .2s var(--ease);
}
.rnd:hover {
  background: var(--signal);
  color: var(--signal-ink);
  transform: rotate(90deg);
}
.clock {
  height: 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 12px;
  border-radius: 14px;
  background: rgba(14, 14, 17, .72);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  position: relative;
  color: var(--ink);
}
.clock small {
  font: 500 9.5px var(--f-mono);
  color: var(--ink-3);
  letter-spacing: .08em;
}
.top .x-top {
  display: none;
}
.desk {
  position: absolute;
  top: calc(var(--gap)*2 + 44px);
  left: calc(var(--gap)*2 + var(--rail-w));
  right: calc(var(--gap)*2 + var(--side-w) + env(safe-area-inset-right, 0px));
  bottom: var(--gap);
  z-index: 10;
}
.links {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 1;
}
.links path {
  fill: none;
  stroke: rgba(255, 255, 255, .3);
  stroke-width: 1.2;
  stroke-dasharray: 2 5;
  stroke-linecap: round;
}
.links circle {
  fill: var(--void);
  stroke: rgba(255, 255, 255, .5);
  stroke-width: 1.2;
}
.lk-lb {
  display: none;
  position: absolute;
  z-index: 2;
  transform: translate(-50%, -50%);
  font: 600 9.5px/1 var(--f-mono);
  padding: 4px 7px;
  border-radius: 5px;
  white-space: nowrap;
  pointer-events: none;
}
.desk.nolinks .links,
.desk.nolinks .lk-lb {
  display: none !important;
}
.node {
  position: absolute;
  width: 118px;
  padding: 6px 6px 10px;
  border-radius: 18px;
  background: rgba(233, 232, 228, .94);
  color: var(--paper-ink);
  z-index: 2;
  touch-action: none;
  cursor: grab;
  transition: transform .25s var(--ease), box-shadow .25s;
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .8);
}
.node:hover {
  transform: translateY(-3px);
}
.node.drag {
  cursor: grabbing;
  transform: scale(1.04);
  transition: none;
}
.node .tile {
  height: 88px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  color: #fff;
}
.node .tile canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.node .tile .ico {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .14);
  position: relative;
}
.node .ext {
  position: absolute;
  left: 50%;
  bottom: 7px;
  transform: translateX(-50%);
  font: 600 9px/1 var(--f-mono);
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .35);
  color: #fff;
  letter-spacing: .04em;
}
.node b {
  display: block;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
  line-height: 1.2;
}
.node small {
  display: block;
  text-align: center;
  font-size: 10.5px;
  color: var(--paper-ink-2);
}
.node .by {
  position: absolute;
  left: -12px;
  top: -12px;
  box-shadow: 0 0 0 3px rgba(233, 232, 228, .94);
  border-radius: 50%;
}
.t-pdf {
  background:
    linear-gradient(
      160deg,
      #ff6a3d,
      var(--signal) 55%,
      #c7340c);
}
.t-git {
  background: #0d0d0f;
}
.t-zip {
  background:
    linear-gradient(
      160deg,
      #3b3a40,
      #1d1d22);
}
.note {
  position: absolute;
  width: 236px;
  padding: 6px;
  border-radius: 20px;
  background: rgba(233, 232, 228, .94);
  color: var(--paper-ink);
  z-index: 2;
  touch-action: none;
  cursor: grab;
  box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .8);
}
.note-in {
  background: #2a2a2f;
  color: var(--ink);
  border-radius: 15px;
  padding: 12px 12px 10px;
  position: relative;
}
.note-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 600 10px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-2);
}
.note-h .pin {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .08);
}
.note ul {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  gap: 7px;
  font-size: 12.5px;
}
.note li {
  display: flex;
  gap: 8px;
  align-items: center;
}
.note li i {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1.5px solid var(--ink-3);
  flex: none;
  display: grid;
  place-items: center;
}
.note li.d {
  color: var(--ink-3);
  text-decoration: line-through;
}
.note li.d i {
  background: var(--signal);
  border-color: var(--signal);
}
.note-f {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 4px 2px 10px;
}
.note-f span {
  flex: 1;
  font: 500 10.5px var(--f-mono);
  color: var(--paper-ink-2);
}
.note-f button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--paper-ink);
  color: var(--paper);
  display: grid;
  place-items: center;
}
.win {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--win);
  border: 1px solid var(--line-2);
  border-radius: 18px;
  box-shadow: 0 50px 90px -30px rgba(0, 0, 0, .85), 0 0 0 1px rgba(0, 0, 0, .5);
  overflow: hidden;
  min-width: 320px;
  min-height: 240px;
}
.win.focus {
  border-color: rgba(255, 255, 255, .2);
}
.win.anim {
  transition:
    left .45s var(--ease),
    top .45s var(--ease),
    width .45s var(--ease),
    height .45s var(--ease);
}
.win.opening::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 90px;
  z-index: 30;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(134, 242, 255, .16) 70%,
      rgba(134, 242, 255, .5) 98%,
      transparent);
  animation: scanIn .8s .12s var(--ease) both;
}
@keyframes scanIn {
  from {
    transform: translateY(-100px);
  }
  to {
    transform: translateY(var(--wh,600px));
  }
}
.wh {
  height: 46px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 7px 0 8px;
  border-bottom: 1px solid var(--line);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  position: relative;
  background: linear-gradient(var(--win-2), var(--win));
}
.wh.drag {
  cursor: grabbing;
}
.w-ic {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--raise);
  color: var(--ink-2);
  flex: none;
  transition: background .25s, color .25s;
}
.win.focus .w-ic {
  background: var(--signal);
  color: var(--signal-ink);
}
.w-tt {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
}
.w-tt b {
  font-size: 13px;
  font-weight: 600;
}
.w-tt span {
  font: 500 11px var(--f-mono);
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
}
.w-pid {
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
  letter-spacing: .05em;
}
.w-ctl {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 11px;
  background: var(--raise);
}
.w-ctl button {
  width: 28px;
  height: 24px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: background .15s, color .15s;
}
.w-ctl button:hover {
  background: var(--raise-2);
  color: var(--ink);
}
.w-ctl .x:hover {
  background: var(--signal);
  color: var(--signal-ink);
}
.wb {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  container-type: inline-size;
}
.w-rs {
  position: absolute;
  right: 2px;
  bottom: 2px;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
  touch-action: none;
  z-index: 5;
  background:
    radial-gradient(
      circle,
      var(--ink-3) 1px,
      transparent 1.4px) 0 0/5px 5px;
  -webkit-mask-image:
    linear-gradient(
      135deg,
      transparent 50%,
      #000 50%);
  mask-image:
    linear-gradient(
      135deg,
      transparent 50%,
      #000 50%);
  opacity: .8;
}
.win.max {
  position: fixed !important;
  left: calc(var(--gap)*2 + var(--rail-w)) !important;
  top: calc(var(--gap)*2 + 44px) !important;
  width: calc(100vw - var(--gap)*4 - var(--rail-w) - var(--side-w)) !important;
  height: calc(100vh - var(--gap)*3 - 44px - 62px) !important;
  z-index: 60 !important;
}
.win.max .w-rs {
  display: none;
}

.ci {
  width: 100%;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px;
  border-radius: 13px;
  text-align: left;
  position: relative;
}
.ci:hover {
  background: var(--raise);
}
.ci.on {
  background: var(--raise-2);
}
.ci b {
  display: block;
  font-size: 13px;
  font-weight: 600;
}
.ci small {
  display: block;
  font-size: 12px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ci .meta {
  display: grid;
  justify-items: end;
  gap: 5px;
}
.ci time {
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
}
.ci .bdg {
  min-width: 18px;
}
.msn-m {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
}
.msn-h {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 10px 0 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.msn-h .stack {
  --sbg:var(--win);
}
.msn-h b {
  display: block;
  font-size: 14px;
  font-weight: 600;
}
.msn-h small {
  display: block;
  font: 500 10.5px var(--f-mono);
  color: var(--ink-3);
  letter-spacing: .05em;
}
.msn-h .sp {
  flex: 1;
}
.feed {
  flex: 1;
  overflow: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  position: relative;
}
.day {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 600 9.5px var(--f-mono);
  color: var(--ink-3);
  letter-spacing: .1em;
}
.day::before,
.day::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.mg {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 10px;
  max-width: 80%;
  position: relative;
}
.mg .nm {
  display: flex;
  gap: 8px;
  align-items: baseline;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}
.mg .nm time {
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
}
.bb {
  display: inline-block;
  padding: 9px 12px;
  border-radius: 4px 15px 15px 15px;
  background: var(--raise);
  font-size: 13.5px;
  line-height: 1.45;
  position: relative;
}
.mg.me {
  margin-left: auto;
  grid-template-columns: minmax(0, 1fr);
  justify-items: end;
}
.mg.me .bb {
  background: var(--signal);
  color: var(--signal-ink);
  border-radius: 15px 4px 15px 15px;
  font-weight: 500;
}
.mg.me .rd {
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
  margin-top: 4px;
}
.att {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  margin-top: 6px;
  padding: 7px 8px 7px 7px;
  border-radius: 13px;
  background: var(--win-2);
  border: 1px solid var(--line);
  max-width: 300px;
  position: relative;
}
.att canvas {
  width: 64px;
  height: 46px;
  border-radius: 9px;
  image-rendering: pixelated;
  display: block;
}
.att b {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
}
.att small {
  display: block;
  font: 500 10.5px var(--f-mono);
  color: var(--ink-3);
}
.rx {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.rx span {
  font-size: 11.5px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--raise);
  border: 1px solid var(--line-2);
}
.rx span.me {
  border-color: var(--signal);
  background: var(--signal-soft);
}
.typing {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 11px var(--f-mono);
  color: var(--ink-3);
}
.typing .dots {
  display: flex;
  gap: 3px;
  padding: 8px 10px;
  border-radius: 999px;
  background: var(--raise);
}
.typing .dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ink-2);
  animation: dot 1.2s infinite;
}
.typing .dots i:nth-child(2) {
  animation-delay: .15s;
}
.typing .dots i:nth-child(3) {
  animation-delay: .3s;
}
@keyframes dot {
  0%, 60%, 100% {
    transform: none;
    opacity: .4;
  }
  30% {
    transform: translateY(-3px);
    opacity: 1;
  }
}
.cmp {
  margin: 0 12px 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px;
  border-radius: 15px;
  background: var(--raise);
  border: 1px solid var(--line);
  position: relative;
}
.cmp input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 0 6px;
  font-size: 13.5px;
  height: 34px;
}
.cmp input::placeholder {
  color: var(--ink-3);
}
.send {
  width: 36px;
  height: 34px;
  border-radius: 11px;
  background: var(--signal);
  color: var(--signal-ink);
  display: grid;
  place-items: center;
  transition: transform .2s var(--ease);
}
.send:hover {
  transform: translateX(2px) rotate(-8deg);
}
.fs {
  display: grid;
  grid-template-columns: 230px 1fr;
  height: 100%;
}
.fs-s {
  border-right: 1px solid var(--line);
  background: var(--win-2);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.fs-sh {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px 4px 14px;
  font-size: 14px;
  font-weight: 600;
}
.fs-sh div {
  display: flex;
  gap: 2px;
}
.fs-seg {
  margin: 0 10px 8px;
  display: flex;
}
.fs-seg .seg {
  width: 100%;
}
.fs-seg .seg button {
  flex: 1;
  justify-content: center;
}
.tree {
  list-style: none;
  margin: 0;
  padding: 0 8px 10px;
  overflow: auto;
  flex: 1;
  position: relative;
}
.tree li {
  position: relative;
}
.tree button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 34px;
  padding: 0 8px;
  border-radius: 10px;
  font-size: 13px;
  color: var(--ink-2);
  text-align: left;
}
.tree button:hover {
  background: var(--raise);
  color: var(--ink);
}
.tree button.on {
  background: var(--raise-2);
  color: var(--ink);
}
.tree button .cnt-p {
  margin-left: auto;
}
.tree ul {
  list-style: none;
  margin: 0;
  padding: 0 0 0 18px;
  position: relative;
}
.tree ul::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 0;
  bottom: 16px;
  width: 1px;
  background: var(--line-2);
}
.tree ul li::before {
  content: "";
  position: absolute;
  left: -2px;
  top: 17px;
  width: 10px;
  height: 1px;
  background: var(--line-2);
}
.fs-m {
  overflow: auto;
  min-width: 0;
  position: relative;
}
.fs-top {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 50px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(18, 18, 21, .92);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.fs-top b {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  gap: 6px;
  align-items: center;
}
.fs-top .sp {
  flex: 1;
}
.fs-sec {
  padding: 14px 16px 4px;
}
.fs-sec h3 {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 600;
}
.folders {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.fold {
  padding: 12px 12px 12px;
  border-radius: 16px;
  border: 1px solid transparent;
  text-align: center;
  transition: background .2s, border-color .2s;
  position: relative;
}
.fold:hover {
  background: var(--win-2);
}
.fold.on {
  background: var(--win-2);
  border-color: var(--line-2);
}
.fshape {
  position: relative;
  height: 84px;
  margin: 0 6px;
}
.fshape .back {
  position: absolute;
  inset: 0 0 0 0;
  border-radius: 12px;
  background: #26262b;
  clip-path: polygon(0 0, 38% 0, 46% 14%, 100% 14%, 100% 100%, 0 100%);
}
.fshape .paper {
  position: absolute;
  left: 14%;
  right: 14%;
  top: 8px;
  height: 58px;
  border-radius: 6px;
  background: #eceae4;
  transform: rotate(-4deg);
  transition: transform .35s var(--ease);
}
.fshape .paper.p2 {
  transform: rotate(5deg);
  background: #f7f6f2;
  left: 18%;
  right: 10%;
}
.fshape .paper::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 16px;
  top: 12px;
  height: 20px;
  background: repeating-linear-gradient(#cfccc4 0 2px, transparent 2px 6px);
}
.fshape .front {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 64px;
  border-radius: 12px;
  background: linear-gradient(#323238, #29292e);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
}
.fold:hover .paper {
  transform: rotate(-8deg) translateY(-6px);
}
.fold:hover .paper.p2 {
  transform: rotate(9deg) translateY(-8px);
}
.fshape .apps {
  position: absolute;
  left: 10px;
  bottom: 9px;
  display: flex;
}
.fshape .apps span {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 700 7.5px var(--f-mono);
  margin-left: -5px;
  box-shadow: 0 0 0 2px #2c2c31;
}
.fshape .apps span:first-child {
  margin-left: 0;
}
.fold b {
  display: block;
  margin-top: 10px;
  font-size: 13.5px;
  font-weight: 600;
}
.fold small {
  display: block;
  color: var(--ink-3);
  font-size: 12px;
}
.ftable {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 4px 0 16px;
}
.ftable th {
  text-align: left;
  font-weight: 500;
  color: var(--ink-3);
  font-size: 12px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.ftable td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.ftable tr:hover td {
  background: var(--win-2);
}
.ftable .nm {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 500;
}
.ftable .who {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ink-2);
}
.ftable .mono {
  color: var(--ink-3);
  font-size: 11.5px;
}
.dz {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.dz-bar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.dz-bar .seg button {
  padding: 0 8px;
}
.dz-bar .fn {
  flex: 1;
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dz-bar .fn small {
  font: 500 10.5px var(--f-mono);
  color: var(--ink-3);
  margin-left: 6px;
}
.share {
  height: 30px;
  padding: 0 12px;
  border-radius: 9px;
  background: var(--signal);
  color: var(--signal-ink);
  font-size: 12.5px;
  font-weight: 600;
}
.zoom {
  font: 500 11px var(--f-mono);
  color: var(--ink-2);
  padding: 0 6px;
}
.dz-in {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr) 200px;
}
.layers {
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 6px;
  background: var(--win-2);
  position: relative;
}
.layers .hd {
  padding: 4px 8px 8px;
  display: flex;
  justify-content: space-between;
}
.ly {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 30px;
  padding: 0 8px;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  text-align: left;
}
.ly:hover {
  background: var(--raise);
  color: var(--ink);
}
.ly.on {
  background: var(--signal-soft);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(255, 79, 31, .45);
}
.ly.on svg {
  color: var(--signal);
}
.ly.sub {
  padding-left: 22px;
}
.cvs {
  position: relative;
  overflow: auto;
  background-color: #0e0e11;
  background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.2px);
  background-size: 16px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 12px 24px;
}
.ab-wrap {
  width: calc(340px * var(--abz));
  height: calc(430px * var(--abz));
  flex: none;
  position: relative;
}
.ab-lb {
  width: calc(340px * var(--abz));
  display: flex;
  justify-content: space-between;
  font: 500 10px var(--f-mono);
  color: var(--ink-3);
  margin-bottom: 6px;
  flex: none;
}
.ab {
  position: absolute;
  left: 0;
  top: 0;
  width: 340px;
  height: 430px;
  transform: scale(var(--abz));
  transform-origin: 0 0;
  background: #f4f3ef;
  color: #141416;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
}
.ab > * {
  position: absolute;
}
.ab .e {
  cursor: pointer;
}
.ab-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: #fff;
  border-bottom: 1px solid #e6e4de;
}
.ab-h b {
  font-size: 11px;
  font-weight: 700;
  display: flex;
  gap: 6px;
  align-items: center;
}
.ab-h b i {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--signal);
}
.ab-h span {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
.ab-h span i {
  width: 30px;
  height: 6px;
  border-radius: 3px;
  background: #d9d7d0;
}
.ab-t {
  font-weight: 700;
  font-size: 23px;
  line-height: 1.02;
  letter-spacing: -.02em;
}
.ab-s {
  display: grid;
  gap: 6px;
  align-content: start;
}
.ab-s i {
  height: 6px;
  border-radius: 3px;
  background: #cfcdc6;
}
.ab-c {
  border-radius: 10px;
  background: var(--signal);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.ab-i {
  border-radius: 12px;
  overflow: hidden;
  background: #141416;
}
.ab-i canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  display: block;
}
.ab-k {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.ab-k div {
  border-radius: 10px;
  background: #e7e5df;
  padding: 10px 8px;
  display: grid;
  gap: 5px;
  align-content: end;
}
.ab-k div i {
  height: 5px;
  border-radius: 3px;
  background: #c8c6bf;
}
.ab-k div i:first-child {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: #141416;
  margin-bottom: auto;
}
.ab-k div:nth-child(2) i:first-child {
  background: var(--signal);
}
.ab-f {
  background: #141416;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
}
.ab-f i {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: #3a3a40;
}
.sel {
  position: absolute;
  border: 1.5px solid var(--signal);
  pointer-events: none;
  transition: all .35s var(--ease);
  z-index: 5;
}
.sel i {
  position: absolute;
  width: 7px;
  height: 7px;
  background: #fff;
  border: 1.5px solid var(--signal);
}
.sel i:nth-child(1) {
  left: -4px;
  top: -4px;
}
.sel i:nth-child(2) {
  right: -4px;
  top: -4px;
}
.sel i:nth-child(3) {
  left: -4px;
  bottom: -4px;
}
.sel i:nth-child(4) {
  right: -4px;
  bottom: -4px;
}
.sel span {
  position: absolute;
  left: 50%;
  top: calc(100% + 6px);
  transform: translateX(-50%);
  font: 600 9.5px/1 var(--f-mono);
  padding: 3px 5px;
  border-radius: 4px;
  background: var(--signal);
  color: #fff;
  white-space: nowrap;
}
.peer {
  position: absolute;
  z-index: 6;
  pointer-events: none;
  animation: peer 9s var(--ease) infinite;
}
.peer span {
  position: absolute;
  left: 12px;
  top: 14px;
  font: 600 10px/1 var(--f-ui);
  padding: 4px 7px;
  border-radius: 0 7px 7px 7px;
  background: #ff8f6b;
  color: #1d0700;
  white-space: nowrap;
}
@keyframes peer {
  0%, 100% {
    transform: translate(250px, 330px);
  }
  30% {
    transform: translate(120px, 160px);
  }
  55% {
    transform: translate(280px, 120px);
  }
  80% {
    transform: translate(60px, 250px);
  }
}
.insp {
  border-left: 1px solid var(--line);
  overflow: auto;
  background: var(--win-2);
  position: relative;
}
.isec {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 9px;
}
.isec .hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ig {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.if {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 9px;
  border-radius: 8px;
  background: var(--raise);
  font: 500 11.5px var(--f-mono);
  color: var(--ink);
}
.if em {
  font-style: normal;
  color: var(--ink-3);
  width: 10px;
}
.sw {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  flex: none;
}
.if .pc {
  margin-left: auto;
  color: var(--ink-3);
}
.cd {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: #0e0e11;
}
.cd-in {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 42px 168px minmax(0, 1fr);
}
.act {
  background: var(--win);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  position: relative;
}
.act .ib {
  position: relative;
}
.act .ib.on {
  color: var(--ink);
}
.act .ib.on::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  border-radius: 2px;
  background: var(--signal);
}
.act .ib .n {
  position: absolute;
  right: 2px;
  bottom: 2px;
  min-width: 13px;
  height: 13px;
  border-radius: 7px;
  background: var(--signal);
  color: var(--signal-ink);
  font: 700 8px/13px var(--f-mono);
  text-align: center;
}
.act .sp {
  flex: 1;
}
.exp {
  background: var(--win-2);
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 6px;
  position: relative;
}
.exp .hd {
  padding: 4px 8px 8px;
}
.fl {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 26px;
  padding: 0 8px;
  border-radius: 7px;
  font: 500 12px var(--f-mono);
  color: var(--ink-2);
  text-align: left;
  white-space: nowrap;
}

#xr {
  position: absolute;
  inset: 0;
  z-index: 70;
  pointer-events: none;
  overflow: hidden;
  visibility: hidden;
  contain: strict;
}
#xr.vis {
  visibility: visible;
}
#xr.lens {
  clip-path: circle(var(--lr) at var(--lx) var(--ly));
}
.xr-in {
  position: absolute;
  inset: 0;
}
#xr.sw,
#xr.sw .xr-in {
  will-change: transform;
}
#os.xfull .wall,
#os.xfull .dotgrid {
  opacity: 0;
}
#os.xfull #screen .win:not(.focus) {
  opacity: 0;
}
#os.xfull #screen .win.focus:not([data-app=browser]) {
  opacity: 0;
}
.xr .win:not(.focus) {
  opacity: .1;
}
#xr .wallx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.xr-host {
  position: absolute;
  inset: 0;
}
.xr-hud {
  position: absolute;
  inset: 0;
  font: 600 10px var(--f-mono);
  color: var(--scan);
  letter-spacing: .08em;
}
.xr-hud .cn {
  position: absolute;
  width: 26px;
  height: 26px;
  border: 2px solid var(--scan);
}
.xr-hud .c1 {
  left: 8px;
  top: 8px;
  border-right: 0;
  border-bottom: 0;
}
.xr-hud .c2 {
  right: 8px;
  top: 8px;
  border-left: 0;
  border-bottom: 0;
}
.xr-hud .c3 {
  left: 8px;
  bottom: 8px;
  border-right: 0;
  border-top: 0;
}
.xr-hud .c4 {
  right: 8px;
  bottom: 8px;
  border-left: 0;
  border-top: 0;
}
.xr-hud .rd {
  position: absolute;
  left: 50%;
  top: 14px;
  transform: translateX(-50%);
  padding: 5px 10px;
  background: var(--scan);
  color: var(--scan-bg);
  white-space: nowrap;
}
.xr-hud .rd2 {
  position: absolute;
  right: 44px;
  bottom: 16px;
  text-shadow: 0 0 8px rgba(134, 242, 255, .6);
}
.xr-hud .sl {
  position: absolute;
  left: 0;
  right: 0;
  height: 120px;
  top: -120px;
  background:
    linear-gradient(
      transparent,
      rgba(134, 242, 255, .08),
      transparent);
  animation: sl 5s linear infinite;
}
@keyframes sl {
  to {
    transform: translateY(calc(100vh + 120px));
  }
}
#beam {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 3px;
  z-index: 75;
  pointer-events: none;
  background: var(--scan);
  box-shadow: 0 0 30px 10px rgba(134, 242, 255, .45), 0 0 120px 40px rgba(134, 242, 255, .18);
  opacity: 0;
}
#lens {
  position: absolute;
  z-index: 76;
  pointer-events: none;
  width: calc(var(--lr) * 2);
  height: calc(var(--lr) * 2);
  left: calc(var(--lx) - var(--lr));
  top: calc(var(--ly) - var(--lr));
  border-radius: 50%;
  border: 1.5px solid var(--scan);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, .6),
    0 0 30px rgba(134, 242, 255, .35),
    inset 0 0 30px rgba(134, 242, 255, .2);
}
#lens::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: repeating-conic-gradient(var(--scan) 0 1deg, transparent 1deg 10deg);
  -webkit-mask-image:
    radial-gradient(
      circle,
      transparent calc(100% - 8px),
      #000 calc(100% - 8px));
  mask-image:
    radial-gradient(
      circle,
      transparent calc(100% - 8px),
      #000 calc(100% - 8px));
  opacity: .7;
  animation: spin 14s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
#lens::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  margin: -7px;
  background: linear-gradient(var(--scan), var(--scan)) center/1.5px 100% no-repeat, linear-gradient(var(--scan), var(--scan)) center/100% 1.5px no-repeat;
  opacity: .8;
}
#lens span {
  position: absolute;
  left: 50%;
  top: calc(100% + 16px);
  transform: translateX(-50%);
  font: 600 10px var(--f-mono);
  letter-spacing: .08em;
  color: var(--scan-bg);
  background: var(--scan);
  padding: 4px 8px;
  white-space: nowrap;
}
.xr,
.xr * {
  color: var(--scan) !important;
  background-color: transparent !important;
  background-image: none !important;
  box-shadow: none !important;
  border-color: rgba(134, 242, 255, .3) !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  text-shadow: none !important;
  animation: none !important;
  transition: none !important;
}
.xr .win,
.xr .w,
.xr .node,
.xr .note,
.xr .rail,
.xr .tools,
.xr .side,
.xr .chip,
.xr .clock,
.xr .team,
.xr .cmd {

@media (max-width: 1180px) {
  :root {
    --side-w:0px;
  }
  .side {
    display: none;
  }
  .top {
    right: calc(var(--gap) + env(safe-area-inset-right, 0px));
  }
  .desk {
    right: calc(var(--gap) + env(safe-area-inset-right, 0px));
  }
  .toasts {
    right: var(--gap);
  }
}
@media (max-width: 760px) {
  :root {
    --gap:8px;
  }
  .rail {
    top: auto;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    left: calc(8px + env(safe-area-inset-left, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    width: auto;
    height: 62px;
    flex-direction: row;
    padding: 0 8px;
    border-radius: 20px;
    overflow-x: auto;
  }
  .r-me,
  .r-logo,
  .r-sep,
  .r-foot .sq,
  .rb .tip {
    display: none;
  }
  .r-apps {
    flex-direction: row;
    margin: 0 auto;
  }
  .r-foot {
    flex-direction: row;
  }
  .rb.run::before {
    left: 50%;
    top: auto;
    bottom: -6px;
    margin: 0 0 0 -2px;
  }
  .rb.on.run::before {
    width: 14px;
    height: 3px;
    margin-left: -7px;
  }
  .top {
    left: calc(8px + env(safe-area-inset-left, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    top: 8px;
  }
  .cmd .ct,
  .cmd .kbd,
  .clock,
  .team .tt,
  .chip div {
    display: none;
  }
  .cmd {
    flex: 0 0 44px;
    margin: 0;
    padding: 0;
    justify-content: center;
  }
  .chip {
    padding: 0 6px;
  }
  .team {
    margin-left: auto;
  }
  .top .x-top {
    display: grid;
  }
  .desk {
    top: 60px;
    left: 8px;
    right: 8px;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  }
  .node,
  .note,
  .links,
  .lk-lb,
  .tools {
    display: none !important;
  }
  .win {
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-width: 0;
  }
  .w-rs,
  .w-ctl .mx,
  .w-pid {
    display: none;
  }
  .toasts {
    left: 8px;
    right: 8px;
    width: auto;
  }
  .lch-g {
    grid-template-columns: 1fr 1fr;
  }
}
@container (max-width:560px) {
  .msn {
    grid-template-columns: 1fr;
  }
  .msn-s {
    display: none;
  }
  .fs {
    grid-template-columns: 1fr;
  }
  .fs-s {
    display: none;
  }
  .dz-in {
    grid-template-columns: 1fr;
  }
  .layers,
  .insp {
    display: none;
  }
  .cd-in {
    grid-template-columns: 42px minmax(0, 1fr);
  }
  .exp {
    display: none;
  }
  .bin.hasdev {
    grid-template-columns: 1fr;
  }
  .dev {
    display: none;
  }
  .hud {
    grid-template-columns: 1fr;
  }
  .hud-c + .hud-c {
    border-left: 0;
    border-top: 1px solid #1b1b1f;
  }
  .st-hero {
    grid-template-columns: 1fr;
  }
  .st-cards {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

.mx-att {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  margin-top: 6px;
  padding: 7px 8px;
  border-radius: 13px;
  background: var(--win-2);
  border: 1px solid var(--line);
  max-width: 340px;
}
.mx-att b {
  display: block;
  font-size: 12.5px;
  word-break: break-word;
}
.mx-att small {
  display: block;
  font: 500 10.5px var(--f-mono);
  color: var(--ink-3);
}
.msn-h .mx-back {
  display: none;
}
.msn.mx-lo {
  grid-template-columns: 1fr;
}
.msn.mx-lo .msn-s {
  display: flex !important;
}
.msn.mx-lo .msn-m {
  display: none;
}
.mx-pinned {
  margin: 8px 14px 0;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--raise);
  border: 1px solid var(--line-2);
  font-size: 12.5px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.mx-pinned span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmp .mx-emo {
  position: absolute;
  bottom: 52px;
  left: 8px;
}
.mx-emo.mx-pop {
  grid-template-columns: repeat(4, 1fr);
  min-width: 0;
  width: 200px;
}
.mx-emo button {
  justify-content: center;
  font-size: 18px;
  padding: 0;
}
.mx-fs {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  height: 100%;
}
.mx-fs.nos {
  grid-template-columns: minmax(0, 1fr);
}
.mx-fs.nos > .fs-s {
  display: none;
}
.mx-main {
  overflow: auto;
  min-width: 0;
  position: relative;
}
.mx-fgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  padding: 14px;
}
.mx-ftile {
  display: grid;
  gap: 6px;
  justify-items: center;
  text-align: center;
  padding: 12px 8px;
  border-radius: 14px;
  background: var(--raise);
  border: 1px solid var(--line);
  font-size: 12.5px;
  word-break: break-word;
}
.mx-ftile:hover {
  background: var(--raise-2);
}
.mx-ftile small {
  color: var(--ink-3);
  font: 500 10px var(--f-mono);
}
.mx-empty {
  padding: 30px 18px;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.5;
}
.mx-doc {
  padding: 16px;
  display: grid;
  gap: 14px;
  max-width: 760px;
}
.mx-doc h3 {
  margin: 0;
  font-size: 17px;
}
.mx-doc p {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-2);
}
.mx-field {
  display: grid;
  gap: 6px;
}
.mx-field > label,
.mx-field > .l {
  font: 600 10px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
}
.mx-opts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.mx-opt {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--raise);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-align: left;
}
.mx-opt[aria-pressed=true] {
  background: var(--signal-soft);
  border-color: rgba(255, 79, 31, .55);
  color: var(--ink);
}
.mx-opt::before {
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-3);
  flex: none;
}
.mx-opt[aria-pressed=true]::before {
  border-color: var(--signal);
  background: radial-gradient(var(--signal) 0 40%, transparent 45%);
}
.mx-field textarea,
.mx-field input[type=text],
.mx-in {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--raise);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
  resize: vertical;
}
.mx-field textarea:focus,
.mx-in:focus {
  outline: 2px solid var(--signal);
  outline-offset: 1px;
}
.mx-csvbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--win-2);
}
.mx-csvbar select {
  height: 32px;
  border-radius: 9px;
  border: 1px solid var(--line-2);
  background: var(--raise);
  color: var(--ink);
  padding: 0 8px;
  font-size: 12.5px;
}
.mx-csv {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(200px, 250px);
  gap: 0;
  min-height: 0;
}
.mx-csvw {
  container-type: inline-size;
  min-height: 0;
}
@container (max-width:760px) {
  .mx-csv {
    grid-template-columns: minmax(0, 1fr);
  }
  .mx-csv .mx-dist {
    border-left: 0;
    border-top: 1px solid var(--line);
  }
}
.todo span {
  min-width: 0;
}
.mx-csvt {
  overflow: auto;
  max-height: 100%;
  min-width: 0;
}
.mx-csvt table {
  width: 100%;
  border-collapse: collapse;
  font: 400 12px var(--f-mono);
}
.mx-csvt th {
  position: sticky;
  top: 0;
  background: var(--win);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-2);
  color: var(--ink-3);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.mx-csvt th:hover {
  color: var(--ink);
}
.mx-csvt td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.mx-dist {
  padding: 12px;
  border-left: 1px solid var(--line);
  display: grid;
  gap: 12px;
  align-content: start;
  overflow: auto;
}
.mx-dist h5 {
  margin: 0 0 6px;
  font: 600 9.5px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
}
.mx-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 8px;
  align-items: center;
  font-size: 12.5px;
  margin-bottom: 6px;
}
.mx-bar i {
  grid-column: 1/-1;
  height: 6px;
  border-radius: 3px;
  background: var(--raise-2);
  overflow: hidden;
}
.mx-bar i b {
  display: block;
  height: 100%;
  background: var(--scan);
}
.mx-bar button {
  height: 24px;
  padding: 0 8px;
  border-radius: 7px;
  background: var(--signal);
  color: var(--signal-ink);
  font-size: 11px;
  font-weight: 700;
}
.mx-badge {
  font: 700 9.5px var(--f-mono);
  letter-spacing: .06em;
  padding: 4px 8px;
  border-radius: 6px;
  background: #ffd84d;
  color: #241b00;
}
.mx-md {
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
  display: grid;
  gap: 10px;
  max-width: 720px;
}
.mx-img {
  padding: 16px;
  display: grid;
  gap: 10px;
  justify-items: start;
}
.mx-img img {
  width: 192px;
  height: 192px;
  image-rendering: pixelated;
  border-radius: 16px;
  background: #141416;
}
.mx-dz {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100%;
  min-height: 0;
}
.mx-dz .dz-bar {
  flex-wrap: wrap;
  height: auto;
  min-height: 48px;
  gap: 6px;
}
.mx-dz-in {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr) 250px;
  min-height: 0;
}
.mx-lib {
  display: grid;
  gap: 4px;
  padding: 6px 0 10px;
}
.mx-lib button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: center;
  min-height: 40px;
  padding: 4px 8px;
  border-radius: 9px;
  background: var(--raise);
  border: 1px solid var(--line);
  font-size: 12.5px;
  text-align: left;
}
.mx-lib button small {
  display: block;
  color: var(--ink-3);
  font-size: 10.5px;
}
.mx-lib button b {
  font-size: 16px;
  color: var(--signal);
}
.mx-lib button[disabled] {
  opacity: .4;
}
.mx-layers {
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 6px;
  background: var(--win-2);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.mx-layers .hd {
  padding: 4px 6px 6px;
  font: 600 9.5px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
}
.mx-sec {
  display: flex;
  align-items: center;
  gap: 2px;
  min-height: 34px;
  padding: 0 4px 0 2px;
  border-radius: 8px;
  color: var(--ink-2);
  font-size: 12.5px;
  position: relative;
}
.mx-sec.on {
  background: var(--signal-soft);
  box-shadow: inset 0 0 0 1px rgba(255, 79, 31, .45);
  color: var(--ink);
}
.mx-sec .nm {
  flex: 1;
  min-width: 0;
  text-align: left;
  height: 34px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: inherit;
}
.mx-drg {
  width: 26px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  cursor: grab;
  touch-action: none;
  border-radius: 8px;
  font-size: 14px;
  letter-spacing: -2px;
  user-select: none;
}
.mx-drg:hover {
  background: rgba(255, 255, 255, .06);
  color: var(--ink);
}
.mx-mv {
  width: 26px;
  height: 28px;
  border-radius: 7px;
  background: rgba(255, 255, 255, .05);
  display: grid;
  place-items: center;
  font-size: 11px;
  color: var(--ink-2);
}
.mx-mv:hover:not([disabled]) {
  background: var(--raise-2);
  color: var(--ink);
}
.mx-mv[disabled] {
  opacity: .28;
  cursor: not-allowed;
}
.mx-lift {
  background: var(--raise-2) !important;
  position: relative;
  z-index: 3;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .5);
}
.mx-cv {
  position: relative;
  overflow: auto;
  background-color: #0e0e11;
  background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.2px);
  background-size: 16px 16px;
  padding: 14px;
  min-width: 0;
}
.mx-cv.pan {
  cursor: grab;
}
.mx-ab {
  width: min(340px, 100%);
  margin: 0 auto;
  background: #f4f3ef;
  color: #141416;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
  transform-origin: top center;
}
.mx-blk {
  position: relative;
  padding: 10px 12px;
  border: 1.5px solid transparent;
  cursor: pointer;
  font-size: 11px;
  line-height: 1.35;
}
.mx-blk:hover {
  border-color: rgba(255, 79, 31, .45);
}
.mx-blk.on {
  border-color: var(--signal);
  background: rgba(255, 79, 31, .06);
}
.mx-blk .tg {
  position: absolute;
  right: 4px;
  top: 2px;
  font: 600 8.5px var(--f-mono);
  color: #8a8982;
  letter-spacing: .06em;
}
.mx-blk h1,
.mx-blk h2 {
  margin: 0 0 4px;
  font-size: 15px;
  line-height: 1.1;
}
.mx-blk h2 {
  font-size: 12px;
}
.mx-blk .cta {
  display: inline-block;
  margin-top: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
}
.mx-blk .rb2 {
  display: grid;
  grid-template-columns: 1fr 70px;
  gap: 8px;
  align-items: center;
}
.mx-blk .rb2 img {
  width: 70px;
  height: 70px;
  image-rendering: pixelated;
  border-radius: 10px;
  background: #141416;
}
.mx-blk .cc {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
.mx-blk .cc i {
  display: block;
  height: 34px;
  border-radius: 7px;
  background: #e7e5df;
}
.mx-blk .ff {
  display: grid;
  gap: 3px;
}
.mx-blk .ff i {
  display: block;
  height: 6px;
  border-radius: 3px;
  background: #d9d7d0;
}
.mx-fix {
  background: #fff;
  padding: 9px 12px;
  font-size: 11px;
  font-weight: 700;
  border-bottom: 1px solid #e6e4de;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mx-fix i {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
}
.mx-ft {
  background: #141416;
  color: #9a9992;
  padding: 10px 12px;
  font-size: 10px;
}
.mx-insp {
  border-left: 1px solid var(--line);
  overflow: auto;
  background: var(--win-2);
  padding: 10px;
  display: grid;
  gap: 12px;
  align-content: start;
}
.mx-insp h4 {
  margin: 0;
  font: 600 9.5px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
}
.mx-insp .mx-in {
  min-height: 36px;
  font-size: 13px;
}
.mx-ratio {
  font: 700 12px var(--f-mono);
  padding: 4px 8px;
  border-radius: 7px;
  display: inline-block;
}
.mx-ratio.ok {
  background: rgba(99, 227, 154, .16);
  color: var(--ok);
}
.mx-ratio.bad {
  background: rgba(255, 143, 143, .18);
  color: #ffb0b0;
}
.mx-imgs {
  display: flex;
  gap: 8px;
}
.mx-imgs button {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  border: 2px solid var(--line-2);
  overflow: hidden;
  background: #141416;
}
.mx-imgs button[aria-pressed=true] {
  border-color: var(--signal);
}
.mx-imgs img {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  display: block;
}
.mx-flds {
  display: grid;
  gap: 4px;
}
.mx-flds .r {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 6px;
  align-items: center;
  font-size: 12px;
}
.mx-tgl {
  height: 28px;
  padding: 0 9px;
  border-radius: 8px;
  border: 1px solid var(--line-2);
  font-size: 11px;
  background: var(--raise);
  color: var(--ink-2);
}
.mx-tgl[aria-pressed=true] {
  background: var(--signal-soft);
  border-color: rgba(255, 79, 31, .5);
  color: var(--ink);
}
.mx-lock {
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255, 216, 77, .12);
  border: 1px solid rgba(255, 216, 77, .35);
  font-size: 12px;
  line-height: 1.4;
}
.mx-pri {
  font: 500 11px/1.4 var(--f-mono);
  color: var(--ink-2);
  padding: 6px 10px;
  background: var(--raise);
  border-radius: 8px;
}
.mx-cd {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 24px;
  height: 100%;
  min-height: 0;
}
.mx-cd-in {
  display: grid;
  grid-template-columns: 44px 190px minmax(0, 1fr);
  min-height: 0;
}
.mx-cd-in.noexp {
  grid-template-columns: 44px minmax(0, 1fr);
}
.mx-cd-in.noexp > .mx-exp {
  display: none;
}
.mx-exp {
  background: var(--win-2);
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px;
  display: grid;
  gap: 2px;
  align-content: start;
  font-size: 12.5px;
}
.mx-exp .hd {
  padding: 4px 6px 8px;
  font: 600 9.5px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
}
.mx-exp button {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 30px;
  padding: 0 8px;
  border-radius: 7px;
  color: var(--ink-2);
  text-align: left;
}
.mx-exp button.on {
  background: var(--raise-2);
  color: var(--ink);
}
.mx-exp .res {
  display: block;
  min-height: 0;
  padding: 6px 8px;
  color: var(--ink-2);
  font: 400 11.5px/1.4 var(--f-mono);
  white-space: normal;
  word-break: break-all;
}
.mx-ed {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  min-width: 0;
  min-height: 0;
}
.mx-edtb {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--win);
}
.mx-edtb .st {
  font: 500 10.5px var(--f-mono);
  color: var(--ink-3);
  margin-left: auto;
}
.mx-edbox {
  position: relative;
  min-height: 0;
  overflow: hidden;
  font: 400 13px/20px var(--f-mono);
  background: var(--win);
}
.mx-edbox .g,
.mx-edbox pre,
.mx-edbox textarea {
  margin: 0;
  font: inherit;
  line-height: 20px;
  tab-size: 2;
}
.mx-edbox .g {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 44px;
  overflow: hidden;
  color: #4a4953;
  text-align: right;
  padding: 8px 8px 8px 0;
  user-select: none;
  background: var(--win);
  z-index: 2;
}
.mx-edbox .g div.hl,
.mx-edbox .hlb {
  color: var(--signal);
}
.mx-edbox pre,
.mx-edbox textarea {
  position: absolute;
  left: 44px;
  top: 0;
  right: 0;
  bottom: 0;
  padding: 8px 12px;
  white-space: pre;
  overflow: auto;
  border: 0;
  outline: 0;
  width: calc(100% - 44px);
  height: 100%;
}
.mx-edbox pre {
  pointer-events: none;
  color: var(--ink);
  background: transparent;
  overflow: hidden;
}
.mx-edbox textarea {
  background: transparent;
  color: transparent;
  caret-color: var(--ink);
  resize: none;
  z-index: 1;
  -webkit-text-fill-color: transparent;
}
.mx-edbox textarea::selection {
  background: rgba(134, 242, 255, .25);
  -webkit-text-fill-color: transparent;
}
.mx-edbox .bars {
  position: absolute;
  left: 44px;
  right: 0;
  top: 8px;
  pointer-events: none;
}
.mx-edbox .bars i {
  position: absolute;
  left: 0;
  right: 0;
  height: 20px;
  background: rgba(255, 79, 31, .14);
  border-left: 2px solid var(--signal);
}
.mx-edbox .bars i.cur {
  background: rgba(134, 242, 255, .12);
  border-left-color: var(--scan);
}
.mx-term {
  height: 104px;
  border-top: 1px solid var(--line);
  background: var(--win);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.mx-term .tt {
  display: flex;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  align-items: center;
  flex: none;
}
.mx-term .tt button {
  height: 100%;
  padding: 0 8px;
  font: 600 10px var(--f-mono);
  letter-spacing: .08em;
  color: var(--ink-3);
}
.mx-term .tt button.on {
  color: var(--ink);
  box-shadow: inset 0 -1px 0 var(--signal);
}
.mx-term .tb2 {
  flex: 1;
  overflow: auto;
  padding: 2px 12px 8px;
  font: 400 12px/18px var(--f-mono);
  color: var(--ink-2);
}
.mx-term .tb2 button.lk {
  color: var(--scan);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-align: left;
}
.mx-term .p {
  color: var(--signal);
}
.mx-term .g {
  color: var(--ok);
}
.mx-term .e {
  color: #ff9d9d;
}
.mx-bw {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.mx-bin {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.mx-bin.hasdev {
  grid-template-columns: minmax(0, 1fr) 270px;
}
.mx-page {
  position: relative;
  background: #d9d7d1;
  overflow: auto;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.mx-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border: 0;
  background: #f4f3ef;
  display: block;
}
.mx-page.ph {

.hello {

}

}

}

.pass {

}
.pass-top {

}

}
.pass-no {

  padding: 18px 0;
  align-items: center;
}
.pass-av svg {

  box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--paper-2);
}

.nc-l {
