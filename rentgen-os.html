тере. Найди три отличия или неудобства и опиши каждое: где, что ожидал(а), что получил(а).","learning_route":[{"title":"ISTQB Certified Tester Foundation Level — официальный syllabus v4.0.1 (англ., PDF)","url":"https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf","verified":"2026-10-30","note":"взрослый стандарт; для школьника — как ориентир, что вообще проверяют тестировщики"},{"title":"MDN Web Docs — Learn web development","url":"https://developer.mozilla.org/en-US/docs/Learn","verified":"2026-10-30"}]},"security":{"id":"security","character":"serg","title":"Специалист по безопасности","tasks":["Решает, какие данные собирать, а какие нет","Настраивает, кто к чему имеет доступ","Ищет уязвимости до того, как их найдут другие","Объясняет команде правила безопасной работы"],"skills":["Принцип минимизации данных","Принцип минимальных прав","Понимание, как устроены сеть и браузер","Внимательное чтение чужого кода"],"tools":["Инструменты проверки сайтов","Сканеры уязвимостей","Журналы доступа","Менеджеры паролей"],"qualities":["Подозрительность в хорошем смысле","Внимательность","Ответственность","Умение сказать «нет»"],"first_exercise":"Возьми любую форму регистрации в интернете и выпиши поля. Для каждого ответь: без этого поля сервис смог бы работать? Сколько полей лишних?","learning_route":[{"title":"Урок цифры — уроки по кибербезопасности (Лаборатория Касперского), для 1–11 классов","url":"https://урокцифры.рф/","verified":"2026-10-30"},{"title":"picoCTF — учебная платформа и соревнование по кибербезопасности для школьников (англ.)","url":"https://www.picoctf.com/","verified":"2026-10-30"}]}},"scoring":{"principles":["Выполнение и баллы считаются отдельно. Действие выполнено (completed), когда выбран принятый вариант из accepts / решена составная задача. Попыток сколько угодно; ноль баллов не блокирует переход.","За действие баллы фиксируются один раз — в момент первого выполнения: score = min(score варианта после scoring_rules, потолок попытки). Потолок: 1-я попытка — 2, 2-я — 1, 3-я и далее — 0. В state: {action_id: {option, score, attempts, completed}}.","Баллы варианта, который не принят, сами по себе не начисляются. Они нужны только как «насколько близко» для текста ответа.","После выполнения игрок может изменить принятый ответ (например, текст кнопки, чтобы сошёлся чек-лист) — выбор и сайт обновляются, но балл не пересчитывается и повторно не начисляется.","Подсказка (hint) баллы не снимает. Исключение — a3_1: scoring {all_correct_first_try: 2, correct_after_hint: 1, else: 0}; «первая попытка» = все три пары верны с первой проверки без подсказки.","a5_1: 1 балл, если при первом запуске чек-листа все пять пунктов зелёные, иначе 0 (но завершить этап можно после исправления). a5_2: 1 балл один раз, когда открыто ≥ 3 разных элемента.","Балл действия засчитывается в success каждой профессии из professions[] этого действия, но в общий счёт — один раз."],"max_points":{"pm":5,"data_analyst":4,"uiux":6,"frontend":6,"qa":4,"security":4,"total":28},"scored_actions":["a1_1_audience","a1_2_goal","a1_3a_survey_topic","a1_3b_survey_device","a2_1_block_order","a2_2_cta_text","a2_3_theme","a3_1_map_decisions","a3_2_schedule_section","a4_1_broken_cta","a4_2_mobile_cards","a4_3a_form_fields","a4_3b_form_access","a5_1_checklist","a5_2_xray_explore"],"unscored_actions":["a5_0_liked_tasks","a5_3_result"],"max_points_note":"По профессиям: pm = a1_1(2)+a1_2(2)+a5_1(1) = 5; data_analyst = a1_3a+a1_3b = 4; uiux = a2_1+a2_2+a2_3 = 6; frontend = a3_1+a3_2+a4_1 = 6; qa = a4_1+a4_2 = 4; security = a4_3a+a4_3b = 4. Общий счёт считает каждое действие один раз: 13 действий по 2 балла + a5_1 (1) + a5_2 (1) = 28. Действие a4_1 входит в success и qa, и frontend — это намеренно (поиск ошибки и исправление — обе профессии) и не удваивает общий счёт; a5_2 не привязано к профессии. Добровольный вопрос a5_0_liked_tasks баллов не даёт.","total_actions":15,"total_max":28},"recommendation":{"two_axes":{"success":"доля набранных баллов от max_points профессии, переводится в полосу: высокая ≥ 75 %, средняя 40–74 %, низкая < 40 %. Процент игроку не показывается — только полоса и список конкретных действий.","interest":"основной сигнал — добровольный ответ игрока «что понравилось» (до трёх профессий); поведенческие сигналы только дополняют. interest_p = min(1, 0.6·liked_p + 0.4·min(1, behaviour_p / cap_p)). Без ответа игрока интерес по поведению не превышает 0.4 и в тексте помечается «по косвенным признакам». Полоса: высокая ≥ 0.70, средняя 0.35–0.69, низкая < 0.35."},"interest_signals":[{"id":"sig_self_report","profession":"*","event":"liked_tasks","kind":"self_report","weight":0.6,"note":"ответ на a5_0_liked_tasks; 0.6 профессии из выбранных"},{"id":"sig_survey_reopen","profession":"data_analyst","event":"preview_file_after_answer","value":"опрос-30-учеников.csv","when":"после принятия a1_3a и a1_3b, вне задания","weight":2,"cap_per_session":2,"kind":"behaviour"},{"id":"sig_ask_anya","profession":"data_analyst","event":"ask_character","value":"anya","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_ask_liza","profession":"pm","event":"ask_character","value":"liza","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_theme_preview","profession":"uiux","event":"theme_preview","when":"≥2 разных варианта до выбора","weight":2,"cap_per_session":2,"kind":"behaviour"},{"id":"sig_layer_browse","profession":"uiux","event":"layer_select","when":"вне задания","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_ask_dima","profession":"uiux","event":"ask_character","value":"dima","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_file_switch","profession":"frontend","event":"file_switch","when":"вне задания","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_devtools","profession":"frontend","event":"devtools_open|dom_click","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_xray_code_tab","profession":"frontend","event":"xray_code_tab","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_ask_kir","profession":"frontend","event":"ask_character","value":"kir","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_phone_toggle_early","profession":"qa","event":"phone_toggle","when":"до подсказки Тани в a4_2","weight":2,"cap_per_session":2,"kind":"behaviour"},{"id":"sig_console_tab","profession":"qa","event":"console_tab_open","weight":1,"cap_per_session":2,"kind":"behaviour"},{"id":"sig_recheck_click","profession":"qa","event":"cta_click_after_fix","weight":1,"cap_per_session":1,"kind":"behaviour"},{"id":"sig_ask_tanya","profession":"qa","event":"ask_character","value":"tanya","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_ask_serg","profession":"security","event":"ask_character","value":"serg","weight":1,"cap_per_session":3,"kind":"behaviour"},{"id":"sig_xray_specialist","profession":"*","event":"xray_specialist_expand","weight":1,"cap_per_session":4,"kind":"behaviour","note":"засчитывается профессии раскрытого специалиста"}],"interest_caps":{"pm":5,"data_analyst":6,"uiux":7,"frontend":9,"qa":7,"security":6},"algorithm":["done = число выполненных (completed) действий из scored_actions, всего 15. Профессия p: success_p = points_p / max_points_p.","interest_p = min(1, 0.6·liked_p + 0.4·min(1, behaviour_p / interest_caps_p)); liked_p = 1, если игрок выбрал профессию в a5_0_liked_tasks, иначе 0; behaviour_p = сумма весов добровольных сигналов с учётом cap_per_session.","rank_p = 0.5 · success_p + 0.5 · interest_p. Игрок видит полосы success и interest и текстовые объяснения; числа и проценты не показываются.","leaders = профессии с rank_p ≥ 0.4, по убыванию rank, не больше трёх.","Режимы экрана (взаимоисключающие): (1) leaders пуст — «лидера нет»: показывается low_everything и карточки всех шести профессий, ранжированного списка нет; (2) один лидер — он плюс ближайшая по rank профессия, помеченная как «ближайшее направление» (few_data); (3) два-три лидера — показываются они.","tie: если rank следующей за последней показанной профессии отличается меньше чем на 0.1, она добавляется (до трёх) и показывается текст tie.","not_enough_data: если done < 12, сверху добавляется баннер not_enough_data. Он не отменяет режимы 1–3, а только помечает карту как предварительную.","Каждое направление объясняется только фактически выполненными действиями и фактическими поведенческими шагами игрока; профессия без выполненных действий и без сигналов не получает объяснения «получилось».","Запрещено: проценты, слова «тип личности», «ты — …», диагнозы. Разрешено: «тебе могло бы понравиться…», «у тебя получилось…»."],"templates":{"header":"Это не оценка. Это карта того, что тебе было интересно и что получалось в проекте «Шестерёнка».","direction_line":"{{profession_title}} — попробовать дальше","success_explain":{"a1_1_audience":"выбрал(а) главного читателя сайта и записал(а) это в бриф","a1_2_goal":"сформулировал(а) задачу сайта как действие","a1_3a_survey_topic":"нашёл(ла) самый частый ответ в учебном опросе","a1_3b_survey_device":"сделал(а) вывод из данных об устройстве","a2_1_block_order":"расставил(а) блоки по пути посетителя","a2_2_cta_text":"подобрал(а) текст кнопки под аудиторию","a2_3_theme":"выбрал(а) оформление с проверкой контраста","a3_1_map_decisions":"нашёл(ла), где в коде живут решения макета","a3_2_schedule_section":"собрал(а) секцию расписания валидной разметкой","a4_1_broken_cta":"починил(а) кнопку, найдя несовпадение id","a4_2_mobile_cards":"исправил(а) расписание на телефоне","a4_3a_form_fields":"сократил(а) форму до необходимых полей","a4_3b_form_access":"ограничил(а) доступ к заявкам","a5_1_checklist":"прошёл(ла) чек-лист запуска","a5_2_xray_explore":"просветил(а) сайт рентгеном"},"interest_explain":{"self_report":"сам(а) отметил(а), что понравились задачи: {{task_labels}}","sig_survey_reopen":"возвращался(ась) к таблице опроса после ответа","sig_theme_preview":"примерил(а) несколько вариантов оформления до выбора","sig_layer_browse":"разглядывал(а) слои макета сверх задания","sig_file_switch":"заглядывал(а) в другие файлы кода сверх задания","sig_devtools":"открывал(а) дерево элементов в браузере","sig_xray_code_tab":"смотрел(а) код элементов в рентгене","sig_phone_toggle_early":"проверил(а) телефон до подсказки","sig_console_tab":"смотрел(а) консоль ошибок","sig_recheck_click":"перепроверил(а) кнопку после исправления","sig_xray_specialist":"в рентгене раскрывал(а), кто и что сделал","sig_ask_character":"задавал(а) вопросы: {{character_name}}"},"not_enough_data":"Ты выполнил(а) {{done}} из 15 шагов — пока рано делать выводы. Карта ниже предварительная.","tie":"Результаты по этим направлениям близкие. Это нормально: выбирай по тому, что было интереснее, или попробуй первые упражнения из карточек.","low_everything":"Явного лидера нет — и это тоже результат. Посмотри карточки всех шести профессий и выбери, чьё первое упражнение захочется сделать.","footer":"Карточки профессий ниже: задачи, навыки, первое упражнение и куда идти дальше.","success_explain_retry":"дошёл(ла) до верного ответа не с первой попытки — {{attempts}}-я попытка","few_data":"Явно выделилось одно направление. Второе показано как ближайшее — оно не лидер, а ориентир.","no_self_report":"Ты не отвечал(а) на вопрос «что понравилось», поэтому интерес оценён только по косвенным признакам — он мог быть выше."},"excluded_signals":{"note":"Обязательные шаги прохождения не считаются доказательством интереса.","removed":{"sig_files_before_a1_3a":"открыть «Файлы» нужно для задания a1_3a","sig_preview_csv":"открыть таблицу нужно для задания a1_3a (заменён на sig_survey_reopen — повторное открытие вне задания)","sig_checklist_revisit":"возврат на этап нужен, чтобы закрыть красный пункт чек-листа","sig_form_field_inspect":"чтобы свести 9 полей к 3, надо переключить не меньше 6 полей","xray_click":"≥3 кликов по элементам — условие a5_2"}}},"fallback_without_ai":{"policy":"Если модуль ИИ недоступен или не настроен, кнопка «Спросить» у каждого персонажа показывает 3–4 заготовленных ответа (fallback_free_question внутри действий) и общие ответы ниже. Прохождение, оценка и рекомендация не зависят от ИИ.","general":{"liza":["Я слежу, чтобы мы делали то, что нужно кружку, а не то, что интересно нам.","Если сомневаешься — вернись к брифу: кто читает и что должен сделать."],"anya":["Цифры в опросе учебные, но привычка считать — настоящая.","Самый частый ответ — приоритет. Второй по частоте — тоже важен, но ниже."],"dima":["Хороший макет объясняется словами: почему это здесь, почему такого цвета.","Контраст и размер важнее вкуса."],"kir":["HTML — что есть, CSS — как выглядит, JS — что делает.","Если не работает — открой консоль, там обычно написано почему."],"tanya":["Проверяй руками то, что «точно работает».","Нашёл ошибку — опиши шаги, чтобы её повторить."],"serg":["Чего не собрали — то не утечёт.","Доступ — только тем, кому он нужен для работы."]}},"ui_strings":{"learning_data_badge":"УЧЕБНЫЕ ДАННЫЕ","demo_form_badge":"УЧЕБНАЯ ФОРМА · НИЧЕГО НЕ ОТПРАВЛЯЕТСЯ","xray_panel_tabs":["Что это","Зачем","Кто участвовал","Твои решения","Код"],"retry_button":"Выбрать иначе","hint_button":"Подсказка","ask_button":"Спросить","check_button":"Проверить","continue_button":"Дальше","change_answer_button":"Изменить ответ","reset_mission":"Начать миссию заново","recommendation_title":"Карта направлений","profession_cards_title":"Карточки профессий","learning_route_title":"Куда идти дальше"}}</script>
<script id="practice-data" type="application/json">{"version":"2.0.0","note":"Практическая миссия: школьник меняет реальный проект. Чат — только общение, задачи, подсказки и обратная связь. Условия этапов считаются по состоянию проекта.","stages":[{"n":1,"title":"Разобраться в задаче","leads":["liza","anya"],"issue":["brief","survey"],"opening":[{"from":"liza","text":"{{name}}, привет! Кружок «Шестерёнка» просит сайт. Бриф и таблица опроса уже у тебя в «Файлах». Сначала разберись, для кого сайт и что на нём главное, и запиши это в бриф."},{"from":"anya","text":"Опрос учебный: цифры придуманы для тренировки. Открой таблицу, отсортируй её, отфильтруй, посмотри распределение ответов. Вывод можно перенести в бриф кнопкой рядом с цифрой."}],"conditions":[{"id":"s1_data","text":"Открыть таблицу опроса и отсортировать или отфильтровать её","app":"files"},{"id":"s1_audience","text":"В брифе выбрать главного читателя и объяснить выбор (от 15 символов)","app":"files"},{"id":"s1_goal","text":"В брифе выбрать главную задачу сайта","app":"files"},{"id":"s1_priority","text":"В брифе выбрать приоритетную информацию (можно кнопкой «В бриф» из таблицы)","app":"files"},{"id":"s1_saved","text":"Сохранить бриф в текущем виде","app":"files"}],"hints":["Нажми на заголовок колонки — таблица отсортируется. Над таблицей есть фильтры: например, посмотри только ответы родителей.","Кто чаще отвечал — это ещё не ответ, кто решает о записи. Выбери читателя сам и объясни почему своими словами.","У каждой строки распределения есть кнопка «В бриф»: она переносит вывод в приоритет. Потом нажми «Сохранить бриф»."],"done":{"from":"liza","text":"Бриф сохранён. Он теперь влияет на проверки сайта. Передаю макет Диме, открой «Макет»."}},{"n":2,"title":"Собрать макет","leads":["dima"],"issue":["layout"],"opening":[{"from":"dima","text":"Залил заготовку: шапка и подвал на месте. Добавляй секции из библиотеки, расставляй по брифу, правь заголовок и текст кнопки, выбирай иллюстрацию и акцент. Есть отмена и возврат: пробуй смело."}],"conditions":[{"id":"s2_sections","text":"Собрать минимум 4 секции, среди них герой и форма записи","app":"design"},{"id":"s2_interact","text":"Добавить хотя бы одну живую секцию: вопросы, робота-конструктор или счётчик дней","app":"design"},{"id":"s2_hero","text":"Написать свой заголовок и свой текст главной кнопки","app":"design"},{"id":"s2_priority","text":"Поставить приоритетную информацию из брифа выше формы","app":"design"},{"id":"s2_order","text":"Форма записи стоит после героя","app":"design"},{"id":"s2_contrast","text":"Цвет кнопки читается: контраст не ниже 4,5:1","app":"design"}],"hints":["Библиотека слева. Секции можно перетаскивать за ⋮⋮ или двигать кнопками ▲▼.","Приоритет из брифа показан в строке подсказки над холстом. Секция с этой информацией должна быть выше формы.","Контраст считается автоматически. Если цифра красная, выбери другой акцент или тёмный текст на кнопке.","Живые секции отвечают на нажатия: вопросы раскрываются, робот меняет цвет, счётчик считает дни. Посетитель сайта будет на них нажимать."],"done":{"from":"dima","text":"Макет собран. Передаю Кириллу в вёрстку."}},{"n":3,"title":"Оживить страницу","leads":["kir"],"issue":["code"],"opening":[{"from":"kir","text":"Беру макет в вёрстку. Файлы index.html, style.css и app.js теперь в «Коде». Нажми «Запуск» и нажми кнопку на сайте: что-то не так. Найди элемент через рентген или макет, поправь небольшой фрагмент и запусти снова."}],"conditions":[{"id":"s3_run","text":"Запустить предпросмотр и нажать кнопку на сайте","app":"code"},{"id":"s3_cta","text":"Кнопка прокручивает страницу к форме (проверено запуском)","app":"code"}],"hints":["Открой в «Браузере» вкладку «Консоль»: там написано, что не нашлось.","Сравни селектор в app.js с id секции формы в index.html. Нужные строки подсвечены.","Править можно либо id в HTML, либо селектор в JS. Главное, чтобы совпало. Если запутался, есть «Вернуть рабочую версию»."],"done":{"from":"kir","text":"Кнопка ведёт к форме. Таня, твой выход."}},{"n":4,"title":"Проверить и исправить","leads":["tanya","serg"],"issue":["report"],"opening":[{"from":"tanya","text":"Сборка зелёная, а это ещё ничего не значит. Открой «Проверки» и запусти каждую сама: кнопка, телефон, пустая форма, заполненная форма. Я записываю ожидание и факт. Всё красное исправляй в макете, коде или настройках формы."},{"from":"serg","text":"Форму смотрю я: какие поля нужны и кто видит заявки. Данные только вымышленные, ничего никуда не отправляется. Если форма просит лишнего, подумай, без чего можно обойтись."}],"conditions":[{"id":"s4_run","text":"Запустить все проверки самостоятельно","app":"checks"},{"id":"s4_pass","text":"Все проверки зелёные на текущей версии сайта","app":"checks"}],"hints":["Нажми «Запустить» у каждой проверки. У красной покажется ожидаемое и фактическое.","После правки проверка станет «устаревшей»: запусти её снова.","Сергей: для пробного занятия нужны имя, класс и один контакт родителя. Заявки должен видеть руководитель кружка, не вся команда."],"done":{"from":"tanya","text":"Все проверки зелёные на этой версии сайта. Лиза, можно передавать."}},{"n":5,"title":"Передать результат","leads":["liza"],"issue":[],"opening":[{"from":"liza","text":"Созвон. Посмотри готовый сайт в «Браузере», включи рентген (X) и узнай, из чьих решений он собран, а потом открой сайт отдельной вкладкой кнопкой «Открыть сайт». В конце получишь карту: что тебе было интересно и что получалось."}],"conditions":[{"id":"s5_green","text":"Все проверки зелёные на текущей версии сайта","app":"checks"},{"id":"s5_view","text":"Открыть готовый сайт в «Браузере»","app":"browser"},{"id":"s5_xray","text":"Просветить рентгеном не меньше трёх элементов сайта","app":"browser"},{"id":"s5_export","text":"Открыть готовый сайт в новой вкладке (кнопка «Открыть сайт»)","app":"design"}],"hints":["Рентген включается клавишей X или кнопкой с рамкой. Потом нажми на элемент сайта.","Открыть сайт: кнопка «Открыть сайт» в «Макете» или в «Коде». Сайт откроется в новой вкладке браузера, на компьютер ничего не скачивается."],"done":{"from":"liza","text":"Сайт передан. Карта направлений готова: открой «Карту»."}}],"brief":{"text":"Кружок робототехники «Шестерёнка» (5–7 классы) просит одностраничный сайт. Сайт должен помочь человеку понять, что это за кружок, увидеть расписание и записаться на пробное занятие. Учебный проект: все данные вымышленные.","audiences":[["students","Школьники 5–7 классов"],["parents","Родители школьников"]],"goals":[["signup","Записать на пробное занятие"],["schedule","Показать расписание"],["about","Рассказать, чем занимаются"]],"priorities":[["расписание","Расписание","schedule"],["чем занимаются на занятиях","Чем занимаются на занятиях","about"],["сколько стоит","Сколько стоит","price"],["как записаться","Как записаться","steps"],["где проходит","Где проходит","contacts"]]},"checks":[{"id":"k_cta","who":"tanya","title":"Кнопка ведёт к форме","how":"Нажимаю главную кнопку на сайте.","kind":"sandbox","deps":["index.html","app.js"]},{"id":"k_mobile","who":"tanya","title":"Телефон 360 px: расписание читается","how":"Открываю сайт шириной 360 px и меряю карточки расписания.","kind":"sandbox","deps":["index.html","style.css"]},{"id":"k_empty","who":"tanya","title":"Пустая форма не принимается","how":"Нажимаю «Отправить» в пустой форме.","kind":"sandbox","deps":["index.html","app.js"]},{"id":"k_filled","who":"tanya","title":"Заполненная учебная форма принимается","how":"Заполняю вымышленными данными и отправляю. Следим, чтобы ничего не уходило в сеть.","kind":"sandbox","deps":["index.html","app.js"]},{"id":"k_contrast","who":"tanya","title":"Кнопка читается (контраст ≥ 4,5:1)","how":"Считаю контраст текста кнопки и её фона.","kind":"static","deps":["style.css"]},{"id":"k_priority","who":"tanya","title":"Приоритет из брифа выше формы","how":"Сверяю бриф и порядок секций.","kind":"static","deps":["index.html"]},{"id":"k_data","who":"serg","title":"Форма собирает только нужное","how":"Смотрю, какие поля просит форма.","kind":"static","deps":["index.html"]},{"id":"k_access","who":"serg","title":"Заявки видит только руководитель","how":"Смотрю, кому адресованы заявки.","kind":"static","deps":["index.html"]},{"id":"k_interact","who":"serg","title":"Живые секции отвечают на нажатия","how":"Нажимаю на вопросы, цвета и глаза робота, смотрю на счётчик дней.","kind":"sandbox","deps":["index.html"]}],"library":[{"type":"hero","title":"Герой","note":"заголовок, кнопка, картинка"},{"type":"schedule","title":"Расписание","note":"три карточки"},{"type":"about","title":"Чем занимаемся","note":"три пункта"},{"type":"price","title":"Стоимость","note":"короткий текст"},{"type":"steps","title":"Как записаться","note":"три шага"},{"type":"contacts","title":"Где проходит","note":"адрес и кабинет"},{"type":"form","title":"Форма записи","note":"поля и получатель"},{"type":"faq","title":"Вопросы и ответы","note":"раскрывающиеся вопросы"},{"type":"builder","title":"Собери робота","note":"кнопки меняют робота"},{"type":"count","title":"Счётчик дней","note":"сколько дней до занятия"}],"evidence":{"pm":{"brief":"написал(а) бриф: читатель, задача и приоритет, с объяснением выбора","final":"довёл(а) проект до состояния «все проверки зелёные» и передал(а) его","export":"собрал(а) и сохранил(а) результат в архив"},"data_analyst":{"csv":"сам(а) сортировал(а) и фильтровал(а) таблицу опроса","insight":"перенёс(ла) вывод из таблицы в бриф: {{insight}}","priority":"поставил(а) приоритетную информацию выше формы"},"uiux":{"sections":"собрал(а) макет из {{n}} секций","hero":"написал(а) свой заголовок и текст кнопки","contrast":"выбрал(а) читаемый цвет кнопки: контраст {{ratio}}:1","mobile":"расписание читается на телефоне"},"frontend":{"cta":"нашёл(ла) и исправил(а) причину неработающей кнопки","edits":"вносил(а) правки в код и запускал(а) предпросмотр: {{n}} раз","form":"форма в коде принимает данные и ничего не отправляет"},"qa":{"ran":"сам(а) запустил(а) проверки: {{n}} из {{total}}","found":"нашёл(ла) ошибки и добился(лась) зелёных проверок после правки: {{n}}","final":"все проверки зелёные на текущей версии"},"security":{"data":"сократил(а) форму до необходимых полей","access":"ограничил(а) доступ к заявкам руководителем кружка"}},"interest_labels":{"undo":"пробовал(а) отмену и возврат в макете","accents":"примерял(а) разные акценты","devtools":"открывал(а) консоль и дерево элементов","reference":"заглядывал(а) в справочник","csv_extra":"изучал(а) таблицу шире, чем нужно для задачи","files_extra":"открывал(а) дополнительные файлы кода","xray_specialist":"в рентгене раскрывал(а), кто и что сделал","xray_code":"смотрел(а) код элементов в рентгене","ask":"задавал(а) вопросы: {{names}}"},"player":{"default_name":"Саша","min":2,"max":20,"title":"Оформим пропуск стажёра","lead":"Ты пришёл(ла) на стажировку в IT-команду Reunion. Сначала пропуск — чтобы команда знала, как к тебе обращаться.","label":"Как тебя зовут?","hint":"Только имя, без фамилии. Его увидит команда в чате и письмах.","error":"Имя — от 2 до 20 букв. Можно пробел и дефис.","button":"Получить пропуск","issued":"Пропуск выдан"},"contacts":{"client":{"name":"Ольга Викторовна","role":"Руководитель кружка «Шестерёнка»","color":"#9fd8ff","mail":"club@shesterenka.example"},"parent":{"name":"Марина К.","role":"Мама участника кружка","color":"#d9c3ff","mail":"marina.k@example.org"}},"mail":[{"id":"welcome","stage":1,"from":"liza","subject":"Добро пожаловать в Reunion, {{name}}!","preview":"Что будет происходить и с чего начать","body":["{{name}}, привет! Я Лиза, руководитель проекта. С сегодняшнего дня ты стажёр в нашей команде.","Кружок робототехники «Шестерёнка» заказал у нас сайт. Делать его будем вместе, и по дороге ты попробуешь работу шести IT-специалистов. Не на словах, а руками: таблицы, макет, код, проверки — всё настоящее.",{"h":"Что тебя ждёт"},{"stages":["Читаешь заявку, разбираешь опрос и пишешь бриф: для кого сайт и что в нём главное.","Собираешь страницу из секций, придумываешь заголовок, выбираешь цвет кнопки.","Находишь в коде, почему кнопка на сайте не работает, и чинишь её.","Запускаешь проверки, как тестировщик, и убираешь из формы лишние данные.","Просвечиваешь готовый сайт рентгеном и открываешь его как настоящий."]},{"h":"Как тут всё устроено"},{"list":["Задания и подсказки приходят в «Команду» — это рабочий чат. Там же можно задать вопрос любому из нас.","Работа идёт в приложениях слева: «Файлы», «Макет», «Код», «Браузер», «Проверки». Окна двигаются, сворачиваются и разворачиваются, как в обычной системе.","Клавиша X включает рентген: он показывает, из чего собрано любое окно и любой элемент сайта.","Застрял(а) — нажми «Подсказка» в задаче или спроси Болтика в «Помощнике»: он видит, на каком ты этапе, и подскажет следующий шаг. Баллы за это не снимаются."]},"В конце не будет оценки. Будет карта: что у тебя получалось и что было интересно. Ошибаться можно — для этого стажировка и нужна.","Заявку от кружка прикладываю. Прочитай её, а потом загляни в чат — там первое задание."],"att":[{"kind":"pdf","name":"бриф-кружка.pdf"}],"actions":[{"label":"Открыть заявку","act":"pdf","primary":true},{"label":"Открыть чат с Лизой","act":"chat:liza"},{"label":"Познакомиться с командой","act":"team"}]},{"id":"client","stage":1,"from":"client","subject":"Заявка на сайт кружка","preview":"Сейчас о нас знают только по объявлению на двери","body":["Здравствуйте!","Пишу от кружка робототехники «Шестерёнка». Мы занимаемся с ребятами 5–7 классов: паяем, программируем, ездим на турниры.","Сейчас о нас узнают только по объявлению на двери кабинета 214. Ребята и родители всё время спрашивают одно и то же: когда занятия и как записаться. Хочется, чтобы на это отвечал сайт, а не я в коридоре.","Подробная заявка во вложении. Если что-то непонятно — спрашивайте, я на связи.","С уважением, Ольга Викторовна"],"att":[{"kind":"pdf","name":"бриф-кружка.pdf"}],"replies":[{"text":"Здравствуйте! Заявку получили, прочитаем и вернёмся с вопросами.","answer":"Отлично, жду! Если надо, пришлю фотографии роботов.","tone":"good"},{"text":"Здравствуйте! Сделаем всё за день, не переживайте.","answer":"Ой, так быстро? Давайте лучше без спешки, но хорошо.","tone":"hmm"},{"text":"Ок.","answer":"…Хорошо. Буду ждать новостей.","tone":"bad"}]},{"id":"client-color","stage":2,"from":"client","subject":"Можно кнопку поярче?","preview":"Оранжевая кнопка и жёлтый текст — будет весело!","body":["Добрый день!","Дима показал первые наброски — ребятам очень понравилось. Одна просьба: можно сделать главную кнопку ярко-оранжевой, а текст на ней светло-жёлтым? Это цвета нашей формы на турнирах, будет весело и узнаваемо.","Ольга Викторовна",{"note":"Дима: «Похоже на настоящую задачу дизайнера. Жёлтый на оранжевом почти не читается. Посмотри контраст в „Макете“ и реши, что ответить. Заказчик не всегда прав, но его всегда нужно понять»."}],"replies":[{"text":"Здравствуйте! Оранжевый оставим, но текст сделаем тёмным: светло-жёлтый на оранжевом плохо читается, особенно с телефона.","answer":"А, я не думала про телефон. Тёмный текст — хорошо, главное, оранжевый.","tone":"good"},{"text":"Конечно, сделаем как просите!","answer":"Спасибо! Ой, а внук говорит, что на его телефоне кнопку не прочитать…","tone":"hmm"},{"text":"Нет, так нельзя.","answer":"Почему нельзя? Объясните, пожалуйста, я не дизайнер.","tone":"bad"}],"actions":[{"label":"Открыть «Макет»","act":"app:design","primary":true},{"label":"Спросить Диму","act":"chat:dima"}]},{"id":"repo","stage":3,"from":"kir","subject":"Доступ к репозиторию","preview":"Вся история сайта и твой первый коммит","body":["Выдал тебе доступ к репозиторию сайта. Там вся история проекта: 48 коммитов команды, кто что менял и зачем.","Разработчики каждый день пишут коммиты: сохраняют изменения и коротко объясняют, что сделали. Хорошее описание — то, по которому через месяц понятно, что произошло. «Поправил» — плохое. «Кнопка ведёт к форме: исправил id секции» — хорошее.","Когда починишь кнопку, сделай свой первый коммит. Ярлык «Репозиторий» лежит на рабочем столе."],"att":[{"kind":"repo","name":"shesterenka.git"}],"actions":[{"label":"Открыть репозиторий","act":"git","primary":true},{"label":"Открыть «Код»","act":"app:code"}]},{"id":"bug","stage":4,"from":"tanya","subject":"Fwd: Ничего не работает!!!","preview":"Настоящий отзыв пользователя: эмоции есть, шагов нет","body":["Пересылаю письмо от мамы одного из ребят: Ольга Викторовна показала ей черновик сайта.",{"quote":"Здравствуйте! Сын нажимает на телефоне на всё подряд, расписание мелкое, ничего не понятно. И зачем вам паспорт?! Я такое заполнять не буду. Марина"},"Вот так обычно и выглядит сообщение об ошибке от пользователя. Шагов нет, но в каждой фразе может прятаться настоящий баг.","Моя работа — превратить такое письмо в проверки: что ожидали, что получили, как повторить. Открывай «Проверки» и пройди их сама. Если найдёшь, из-за чего мама права, — чини."],"actions":[{"label":"Открыть «Проверки»","act":"app:checks","primary":true},{"label":"Написать Сергею про паспорт","act":"chat:serg"}]},{"id":"launch","stage":5,"from":"client","subject":"Ждём запуск!","preview":"Ребята уже решили, кого позовут на пробное","body":["Здравствуйте!","Ребята уже договорились, кого позовут на пробное занятие, ждут ссылку на сайт. Как будет готово — дайте знать!","Ольга Викторовна"],"replies":[{"text":"Здравствуйте! Осталась финальная проверка. Как только откроем сайт, пришлём ссылку.","answer":"Спасибо! Ребята уже репетируют, как будут показывать роботов.","tone":"good"},{"text":"Уже всё готово!","answer":"Правда? А можно посмотреть? Ссылка не пришла…","tone":"hmm"}],"actions":[{"label":"Открыть «Браузер»","act":"app:browser","primary":true}]},{"id":"finish","stage":6,"from":"liza","subject":"Итоги стажировки","preview":"Карта направлений и твои достижения","body":["{{name}}, сайт передан заказчику. Спасибо за работу!","За эту стажировку ты побывал(а) в шести ролях: руководителя проекта, аналитика, дизайнера, разработчика, тестировщика и специалиста по безопасности. Одни задачи наверняка зашли лучше других — это и есть самое ценное наблюдение.","Карта направлений уже готова: в ней только то, что ты на самом деле делал(а). А на пропуске собраны достижения за смену."],"actions":[{"label":"Открыть карту","act":"app:map","primary":true},{"label":"Мой пропуск и достижения","act":"pass"}]}],"achievements":[{"id":"a_reader","title":"Читаю заявку","text":"Открыл(а) заявку заказчика. Хорошая работа начинается с чтения задачи.","prof":"pm"},{"id":"a_reply","title":"Вежливо и по делу","text":"Ответил(а) заказчику так, что он остался доволен.","prof":"pm"},{"id":"a_brief","title":"Бриф подписан","text":"Сохранил(а) бриф: читатель, задача и приоритет.","prof":"pm"},{"id":"a_sort","title":"Первая сортировка","text":"Отсортировал(а) таблицу опроса. С этого начинается аналитика.","prof":"data_analyst"},{"id":"a_filter","title":"Охотник за данными","text":"Посмотрел(а) на опрос с разных сторон: два фильтра и больше.","prof":"data_analyst"},{"id":"a_mood","title":"Насмотренность","text":"Отобрал(а) три референса в подборку.","prof":"uiux"},{"id":"a_accent","title":"Палитра","text":"Примерил(а) три разных цвета, прежде чем выбрать.","prof":"uiux"},{"id":"a_undo","title":"Машина времени","text":"Отменил(а) правку в макете. Дизайнеры делают это сотни раз в день.","prof":"uiux"},{"id":"a_console","title":"Читаю консоль","text":"Заглянул(а) в консоль браузера, где ошибки пишут сами о себе.","prof":"frontend"},{"id":"a_commit","title":"Первый коммит","text":"Сохранил(а) свои изменения в репозиторий с описанием.","prof":"frontend"},{"id":"a_bug","title":"Пойман баг","text":"Проверка была красной, а после твоей правки стала зелёной.","prof":"qa"},{"id":"a_green","title":"Всё зелёное","text":"Все проверки прошли на текущей версии сайта.","prof":"qa"},{"id":"a_privacy","title":"Чего не собрали — не утечёт","text":"Убрал(а) из формы данные, без которых можно обойтись.","prof":"security"},{"id":"a_xray","title":"Рентгенолог","text":"Просветил(а) три элемента сайта и узнал(а), кто их делал.","prof":null},{"id":"a_explorer","title":"Любопытный стажёр","text":"Открыл(а) заявку, референсы, шрифты и репозиторий на рабочем столе.","prof":null},{"id":"a_launch","title":"Первый релиз","text":"Открыл(а) готовый сайт как настоящий.","prof":null}],"desk":{"brief_pdf":{"name":"бриф-кружка.pdf","pages":[{"blocks":[{"kicker":"Кружок робототехники «Шестерёнка» · школа, кабинет 214"},{"title":"Заявка на создание сайта"},{"meta":[["Заказчик","Ольга Викторовна, руководитель кружка"],["Исполнитель","команда Reunion"],["Дата","сентябрь 2026"]]},{"h":"О кружке"},{"p":"Мы собираем и программируем роботов с ребятами 5–7 классов. Три занятия в неделю, в кабинете 214. Весной ездим на городской турнир «Робо-старт»."},{"p":"В кружке сейчас 17 человек. Хотим, чтобы к нам приходили новые ребята — особенно те, кто никогда не пробовал программировать."},{"h":"Почему нам нужен сайт"},{"p":"Сейчас о кружке можно узнать только из объявления на двери. Ребята и родители всё время спрашивают одно и то же: когда занятия, сколько стоит, как записаться. Сайт должен отвечать на эти вопросы сам."}]},{"blocks":[{"h":"Что должно быть на сайте"},{"list":["Понятно, что это за кружок и для кого он.","Расписание: дни, время, кабинет.","Запись на бесплатное пробное занятие.","Чем мы занимаемся на занятиях.","Как с нами связаться."]},{"h":"Кто будет читать сайт"},{"p":"Ребята 5–7 классов и их родители. Кто из них главный — решите сами, мы спорили и не договорились."},{"p":"Сделали небольшой опрос среди ребят и родителей (30 ответов). Таблицу передадим отдельно."},{"h":"Чего мы не хотим"},{"list":["Длинных текстов, которые никто не дочитает.","Чтобы на телефоне всё было мелко.","Собирать лишние данные о детях."]}]},{"blocks":[{"h":"Материалы"},{"list":["Референсы — сайты, которые нам нравятся (собрал Дима, 12 картинок).","Шрифты: Onest и JetBrains Mono.","Наш талисман — робот Болтик. Его можно рисовать как угодно, лишь бы был с антенной."]},{"h":"Сроки"},{"table":[["Этап","К function sortable(list, handleSel, itemSel, done) {
  list.addEventListener("pointerdown", (e) => {
    const h = e.target.closest(handleSel);
    if (!h || e.pointerType === "mouse" && e.button !== 0) return;
    const item = h.closest(itemSel);
    if (!item) return;
    e.preventDefault();
    const items = $$(itemSel, list), rects = items.map((i) => i.getBoundingClientRect()), from = items.indexOf(item), y0 = e.clientY;
    let to = from;
    item.classList.add("mx-lift");
    try {
      h.setPointerCapture(e.pointerId);
    } catch (_) {
    }
    const mv = (ev) => {
      const dy = ev.clientY - y0;
      item.style.transform = `translateY(${dy}px)`;
      const cy = rects[from].top + rects[from].height / 2 + dy;
      to = 0;
      rects.forEach((r, i) => {
        if (i !== from && cy > r.top + r.height / 2) to++;
      });
      items.forEach((it, i) => {
        if (it === item) return;
        let sh = 0;
        if (from < to && i > from && i <= to) sh = -rects[from].height;
        else if (from > to && i < from && i >= to) sh = rects[from].height;
        it.style.transform = sh ? `translateY(${sh}px)` : "";
      });
    };
    const up = () => {
      h.removeEventListener("pointermove", mv);
      h.removeEventListener("pointerup", up);
      h.removeEventListener("pointercancel", up);
      items.forEach((it) => {
        it.style.transform = "";
      });
      item.classList.remove("mx-lift");
      if (to !== from) {
        const ord = items.map((i) => i.dataset.sec);
        ord.splice(from, 1);
        ord.splice(to, 0, item.dataset.sec);
        done(ord);
      }
    };
    h.addEventListener("pointermove", mv);
    h.addEventListener("pointerup", up);
    h.addEventListener("pointercancel", up);
  });
}

function drawRef(cv, i) {
  const R = DESK.refs[i % DESK.refs.length], [bg, ink, acc] = R.pal, w = 64, h = 48;
  cv.width = w;
  cv.height = h;
  const c = cv.getContext("2d"), soft = mixHex(bg, ink, 0.1), mid = mixHex(bg, ink, 0.32);
  const box = (x, y, bw, bh, col) => {
    c.fillStyle = col;
    c.fillRect(x, y, bw, bh);
  };
  const circ = (x, y, r, col) => {
    c.fillStyle = col;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  };
  const chrome = () => {
    box(0, 0, w, 5, soft);
    box(2, 2, 1, 1, mid);
    box(4, 2, 1, 1, mid);
    box(6, 2, 1, 1, mid);
    box(12, 1, 30, 3, bg);
  };
  const bot = (x, y, s, body) => {
    box(x + 3 * s, y, s, 3 * s, ink);
    box(x, y + 3 * s, 7 * s, 5 * s, body);
    box(x + 2 * s, y + 5 * s, s, s, bg);
    box(x + 4 * s, y + 5 * s, s, s, bg);
    box(x + s, y + 9 * s, 5 * s, 4 * s, ink);
  };
  box(0, 0, w, h, bg);
  const k = R.kind;
  if (k === "hero") {
    chrome();
    box(6, 11, 28, 4, ink);
    box(6, 17, 21, 4, ink);
    box(6, 24, 26, 1, mid);
    box(6, 27, 20, 1, mid);
    box(6, 32, 14, 6, acc);
    circ(47, 25, 11, acc);
    bot(43, 17, 1.2, ink);
  } else if (k === "cards") {
    chrome();
    box(6, 9, 22, 3, ink);
    for (let j = 0; j < 3; j++) {
      const x = 5 + j * 19;
      box(x, 16, 17, 22, soft);
      box(x, 16, 2, 22, acc);
      box(x + 4, 20, 10, 3, ink);
      box(x + 4, 26, 8, 1, mid);
      box(x + 4, 29, 6, 1, mid);
    }
  } else if (k === "poster") {
    circ(32, 21, 16, acc);
    for (let y = 22; y < 38; y += 4) box(14, y, 36, 1.4, bg);
    box(8, 40, 34, 3, ink);
    box(8, 45, 20, 1, mid);
  } else if (k === "form") {
    chrome();
    box(8, 9, 26, 3, ink);
    for (let j = 0; j < 3; j++) {
      box(8, 15 + j * 8, 14, 1, mid);
      box(8, 17 + j * 8, 48, 4, soft);
    }
    box(8, 40, 48, 5, acc);
  } else if (k === "photo") {
    circ(30, 18, 20, mixHex(bg, acc, 0.25));
    box(0, 36, w, 12, mixHex(bg, ink, 0.2));
    bot(22, 8, 2.6, acc);
    box(0, 44, w, 4, mixHex(bg, ink, 0.12));
  } else if (k === "grid") {

      <input id="aiK" class="mx-in" type="password" autocomplete="off" spellcheck="false" placeholder="${cfg.from === "file" ? "задан в ai-config.js" : "sk-…"}" value="${esc(own.apiKey || "")}">
      <label for="aiMo">Модель</label>
      <select id="aiMo" class="mx-in">${AI_MODELS.map((m) => `<option value="${m[0]}"${m[0] === cfg.model ? " selected" : ""}>${m[1]}</option>`).join("")}</select>
      <div class="mx-row"><button type="submit" class="mx-btn p">Сохранить</button><button type="button" class="mx-btn" id="aiT">Проверить связь</button>${own.apiKey ? '<button type="button" class="mx-btn" id="aiD">Удалить ключ из браузера</button>' : ""}</div>
      <p class="mx-note" id="aiR">${AI.ready ? `Сейчас подключено: ${esc(cfg.model)}, ключ из ${cfg.from === "file" ? "ai-config.js" : "настроек"}.` : "Сейчас ИИ не подключён."}</p>
      <p class="mx-note">Не публикуйте в интернете файлы, в которых лежит ключ: любой, кто откроет страницу, сможет его увидеть.</p>
    </form>`, "aiO");
  const save = () => aiSave({ apiKey: $("#aiK").value.trim(), model: $("#aiMo").value });
  $("#aiS").onsubmit = (e) => {
    e.preventDefault();
    save();
    close();
    toast({ avHtml: botAv(36), t: AI.ready ? "Болтик подключён к DeepSeek" : "ИИ выключен", p: AI.ready ? "Теперь помощник и команда в чате отвечают с помощью ИИ." : "Помощник отвечает заготовками из миссии." });
  };
  $("#aiT").onclick = async () => {
    save();
    const r = $("#aiR");
    if (!AI.ready) {
      r.textContent = "Сначала вставь ключ.";
      return;
    }
    r.textContent = "Проверяю…";
    try {
      const a = await AI.chat([{ role: "user", content: "Ответь одним словом: готов" }], { maxTokens: 10, timeout: 15e3 });
      r.textContent = `Связь есть. DeepSeek ответил: «${a}».`;
    } catch (e) {
      r.textContent = e.message;
    }
  };
  const d = $("#aiD");
  if (d) d.onclick = () => {
    aiSave({ apiKey: "" });
    close();
    showAiSettings();
  };
}
Object.assign(ACTS, {
  "ai-chip": (t) => aiSend(t.dataset.q),
  "ai-clear": () => {
    M.state.ui.ai = [];
    M.save();
    rerender("ai");
  },
  "ai-set": () => showAiSettings()
});

window.__os = {

    cascade = 0;
    const L = {

      files: [["files", { x: 60, y: 20, w: 860, h: 600 }]],
      design: [["design", { x: 30, y: 10, w: 960, h: 620 }]],
      code: [["code", { x: 60, y: 20, w: 900, h: 600 }]],
      browser: [["browser", { x: 30, y: 10, w: 960, h: 620 }]],
      monitor: [["monitor", { x: 100, y: 60, w: 820, h: 520 }]]
    }[name] || [];
    L.forEach(([id, pos]) => openApp(id, { quiet: true, pos }));
    drawLinks();
  }
};
function start() {
  paintWalls();
  renderRail();
  renderTop();
  renderSide();
  renderTools();
  renderNodes();
  ensureMapApp();
  renderMhud();
  syncBadges();

  checkAchievements(true);
}
start();
function openFirst() {

  UI.stick[UI.chat] = true;
  rerender("chat");
  checkMail();
}
const progressed = M.state.stage > 1 || M.state.log.edits > 0 || M.state.brief.audience;
if (STATIC) {
} else if (FAST) {
  if (!PLAYER.name) savePlayer(PR.player.default_name, true);
  markMailNotified();
  openFirst();
} else if (!PLAYER.name) (REDUCE ? Promise.resolve() : boot()).then(askName).then(firstDay);
else if (REDUCE || progressed) openFirst();
else boot().then(openFirst);

})();
